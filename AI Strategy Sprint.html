<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Strategy Sprint</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1b2a2a;--mute:#5c6b6b;--line:#cfd8d4;--acc:#0d6b63;--accink:#fff;--good:#1c7a3d;--goodbg:#e2f3e7;--mid:#8a5a00;--midbg:#fbefd2;--bad:#a63232;--badbg:#f8e1e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2623;--ink:#e6efec;--mute:#9db0ab;--line:#33433f;--acc:#4fc3b5;--accink:#0b1a17;--good:#6fd48d;--goodbg:#1b3a27;--mid:#e9b84f;--midbg:#3b3014;--bad:#f08a8a;--badbg:#412121}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2623;--ink:#e6efec;--mute:#9db0ab;--line:#33433f;--acc:#4fc3b5;--accink:#0b1a17;--good:#6fd48d;--goodbg:#1b3a27;--mid:#e9b84f;--midbg:#3b3014;--bad:#f08a8a;--badbg:#412121}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accink:#0b1a17}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;line-height:1.15;margin:0 0 8px}
h2{font-family:Georgia,serif;font-size:1.25rem;margin:0 0 8px}
p{margin:0 0 12px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:12px 20px;font-weight:700}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-weight:700}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;background:var(--acc);width:100%;transition:width 1s linear}
.fill.low{background:var(--bad)}
.ind{display:inline-block;background:var(--acc);color:var(--accink);border-radius:6px;padding:2px 10px;font-size:.9rem;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.mid{border-color:var(--mid);background:var(--midbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.pick{box-shadow:0 0 0 3px var(--ink)}
.opt small{display:block;margin-top:6px;color:var(--ink)}
.tag{font-weight:700}
.big{font-family:Georgia,serif;font-size:2.6rem;margin:4px 0}
ul{padding-left:20px;margin:0 0 12px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
var R=[
{ind:"Construction",t:"Weather and subcontractor delays are pushing 40 sites off schedule. Your weekly status reports arrive too late to act.",
o:[["Ask a general chatbot to rewrite the master schedule every morning.",0,"With no live site data, the chatbot guesses. Fast output, unreliable plan."],
["Feed progress data and weather forecasts into a predictive scheduling model that flags at-risk tasks; review flags weekly with site leads.",100,"Data in, early warnings out, and people still decide. This catches slips before they compound."],
["Replace site reports with AI-written summaries only.",50,"Summaries save time, but without structured data they hide the early signals you need."]]},
{ind:"Healthcare IT",t:"An electronic health record rollout faces clinician resistance and strict patient privacy rules. Go-live is in 8 weeks.",
o:[["Paste real workflow notes into a public AI tool to draft training fast.",0,"Patient and workflow details must not leave approved systems. Privacy risk outweighs the speed."],
["Use an approved enterprise AI assistant to tailor training by role and answer floor questions. Clinical leads review all content.",100,"Role-based help reduces resistance, and governance plus clinical review keeps it safe."],
["Skip AI and run the same training for everyone.",50,"Safe, but generic training is what drives resistance in the first place."]]},
{ind:"Software",t:"The backlog has 900 items, many overlapping. Stakeholders keep adding scope and the release date is fixed.",
o:[["Let AI auto-prioritize and remove items without review.",0,"Automated cuts without the product owner risk dropping what stakeholders truly need."],
["Use AI to cluster duplicates and draft impact summaries per request. The product owner decides what moves.",100,"AI does the sorting and analysis; humans own the trade-offs and the conversation."],
["Ask AI to write more user stories to cover every request.",20,"More stories means more scope. This makes the real problem worse."]]},
{ind:"Manufacturing",t:"A key supplier is late again. A line stoppage would cost more than the project's contingency budget.",
o:[["Build a supplier risk score from delivery history, shipping data and news. Trigger early alerts and pre-approve backup sources.",100,"Prediction plus a ready fallback turns a surprise into a routine decision."],
["Ask AI to email the supplier daily for updates.",30,"More pings do not change the supplier's capacity. You learn late, just more often."],
["Double all safety stock using an AI-generated forecast.",50,"It protects the line but ties up cash. Targeted risk scoring is cheaper."]]},
{ind:"Financial services",t:"A new regulation changes 120 controls across a program. Auditors will ask how every decision was made.",
o:[["Have AI map the regulation text to existing controls and flag gaps. Compliance signs off and every output is logged.",100,"Speeds up the heavy reading while keeping accountability and an audit trail."],
["Let AI approve the control changes directly.",0,"Regulators expect accountable people. No sign-off means no defensible audit trail."],
["Avoid AI entirely to be safe.",40,"Safe, but manual mapping is slow and error-prone across 120 controls."]]}
];
var T=60,app=document.getElementById("app"),i=0,score=0,base=0,bonus=0,tm=null,left=T,done=false,order=[];
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),x=a[k];a[k]=a[j];a[j]=x}return a}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function start(){i=0;score=0;base=0;bonus=0;round()}
function intro(){app.innerHTML='<h1>AI Strategy Sprint</h1><p class="mute">A 5-minute game for project managers.</p><div class="card"><p>Five industries. Five project crises. You have 60 seconds each to choose the strategy that uses AI well.</p><ul><li>Best strategy: 100 points, plus up to 20 for speed</li><li>Partial credit for safe but weaker options</li><li>Risky or unsupported AI use scores low</li></ul></div><button class="btn" id="go">Start sprint</button>';document.getElementById("go").onclick=start}
function round(){var r=R[i];done=false;left=T;order=shuffle(r.o.map(function(_,k){return k}));
var h='<div class="bar"><span>Round '+(i+1)+' of '+R.length+'</span><span id="tm">'+T+'s</span><span>Score '+score+'</span></div><div class="track"><div class="fill" id="fl"></div></div><div class="card"><span class="ind">'+r.ind+'</span><h2>'+esc(r.t)+'</h2><p class="mute">Which strategy do you choose?</p></div><div id="opts">';
order.forEach(function(k,n){h+='<button class="opt" data-k="'+k+'">'+esc(r.o[k][0])+'</button>'});
h+='</div><div id="fb"></div>';app.innerHTML=h;
Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.k)}});
clearInterval(tm);tm=setInterval(tick,1000);setTimeout(function(){var f=document.getElementById("fl");if(f)f.style.width="0%"},50);
document.getElementById("fl").style.transitionDuration=T+"s"}
function tick(){left--;var t=document.getElementById("tm");if(t)t.textContent=left+"s";var f=document.getElementById("fl");if(f&&left<=10)f.classList.add("low");if(left<=0)pick(-1)}
function cls(s){return s>=100?"good":s>=40?"mid":"bad"}
function pick(k){if(done)return;done=true;clearInterval(tm);var r=R[i],pts=0,msg="";
var f=document.getElementById("fl");if(f){f.style.transition="none"}
if(k>=0){pts=r.o[k][1];base+=pts;if(pts===100){var b=Math.round(20*left/T);bonus+=b;pts+=b}score+=pts}
Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){var q=+b.dataset.k;b.disabled=true;b.classList.add(cls(r.o[q][1]));if(q===k)b.classList.add("pick");b.innerHTML=esc(r.o[q][0])+'<small><span class="tag">'+(r.o[q][1]>=100?"Strong. ":r.o[q][1]>=40?"Partial. ":"Weak. ")+(q===k?"Your pick. ":"")+'</span>'+esc(r.o[q][2])+'</small>'});
msg=k<0?"Time is up. No points this round.":"You earned "+pts+" points.";
document.getElementById("fb").innerHTML='<p><strong>'+msg+'</strong></p><button class="btn" id="nx">'+(i<R.length-1?"Next round":"See results")+'</button>';
var n=document.getElementById("nx");n.focus();n.onclick=function(){i++;if(i<R.length)round();else end()}}
function end(){var max=R.length*120,p=score/max,rk=p>=.8?"AI-ready strategist":p>=.55?"Capable navigator":"Early explorer";
app.innerHTML='<h1>Sprint complete</h1><div class="card"><div class="big">'+score+' / '+max+'</div><h2>'+rk+'</h2><ul><li>Strategy points: '+base+' / '+(R.length*100)+'</li><li>Speed bonus: '+bonus+' / '+(R.length*20)+' (earned only on best answers, shrinking as the timer runs down)</li></ul></div><div class="card"><h2>The pattern behind the best answers</h2><ul><li>Feed AI real project data, not guesses.</li><li>Keep a named human accountable for decisions.</li><li>Respect industry rules: privacy, safety, audit trails.</li><li>Use AI to see problems earlier, then pre-plan the response.</li></ul></div><button class="btn" id="again">Play again</button>';
document.getElementById("again").onclick=start}
intro();
</script>
</body>
</html>
